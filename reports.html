<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanvila — Daily Service & Sales Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0c0a; --panel:#161310; --card:#1b1712; --card-soft:#211c16;
    --gold:#c9a96e; --gold-light:#e2c78a; --cream:#f5f0e8;
    --muted:#8a7d6a; --line:rgba(201,169,110,.18); --danger:#c9756a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Jost',system-ui,sans-serif;font-weight:300;}
  header{background:var(--ink);color:var(--cream);padding:20px 24px;border-bottom:1px solid var(--line);}
  .wrap{max-width:1040px;margin:0 auto;}
  header .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{width:30px;height:30px;color:var(--gold);flex:none;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .title{font-size:20px;font-weight:400;font-family:'Cormorant Garamond',serif;letter-spacing:.02em;color:var(--cream);}
  nav{display:flex;gap:8px;flex-wrap:wrap;}
  nav button{padding:9px 16px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--cream);font-size:13px;font-family:'Jost',sans-serif;cursor:pointer;letter-spacing:.02em;}
  nav button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  main{max-width:1040px;margin:0 auto;padding:32px 24px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:24px;}
  .btn{padding:9px 18px;border-radius:2px;border:none;background:var(--gold);color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em;}
  .btn.outline{background:transparent;border:1px solid var(--line);color:var(--cream);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px;}
  .filter-btn{padding:6px 14px;border-radius:2px;border:1px solid var(--line);background:var(--card);font-size:12.5px;cursor:pointer;color:var(--cream);}
  .filter-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:32px;}
  .stat{border-radius:4px;padding:18px;border:1px solid var(--line);background:var(--card);}
  .stat.accent{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;}
  .stat.accent .label{color:rgba(14,12,10,.65);}
  .stat .value{font-size:23px;font-weight:400;font-family:'Cormorant Garamond',serif;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{background:var(--panel);color:var(--gold-light);text-align:left;padding:11px 14px;font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
  td{padding:10px 14px;border-top:1px solid var(--line);color:var(--cream);}
  tr:nth-child(even) td{background:var(--card-soft);}
  .bar-row{margin-bottom:14px;}
  .bar-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;}
  .bar-bg{height:8px;background:var(--panel);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);}
  form.entry{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;}
  form.entry label{font-size:11.5px;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:5px;}
  form.entry input,form.entry select{width:100%;border:1px solid var(--line);border-radius:2px;padding:9px 11px;font-size:14px;background:var(--panel);color:var(--cream);font-family:inherit;}
  form.entry input::placeholder{color:var(--muted);}
  form.entry select option{background:var(--panel);color:var(--cream);}
  .full{grid-column:1/-1;}
  .error{color:var(--danger);font-size:13px;margin-bottom:10px;}
  .empty{color:var(--muted);font-size:14px;padding:20px 0;}
  #gate{position:fixed;inset:0;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:50;}
  #gate input{padding:10px 14px;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--cream);font-size:15px;width:220px;font-family:'Jost',sans-serif;}
  #gate input::placeholder{color:var(--muted);}
  #gate .err{color:var(--danger);font-size:13px;height:16px;}
  .toolbar{display:flex;justify-content:flex-end;padding:14px 18px;border-bottom:1px solid var(--line);}
  .field-group{transition:opacity .15s ease;}
  .field-group.dimmed{opacity:.35;}
  .field-group.dimmed input,.field-group.dimmed select{background:var(--card-soft);cursor:not-allowed;}
  .counter-note{grid-column:1/-1;background:rgba(201,169,110,.08);border:1px solid var(--line);border-radius:2px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
</style>
</head>
<body>

  <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px;color:#c9a96e;">
    <circle cx="22" cy="22" r="21" stroke="currentColor" stroke-width="0.8"/>
    <g transform="translate(22,22)">
      <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(0)"/>
      <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(45)"/>
      <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(90)"/>

  </svg>
  <div class="eyebrow">Sanvila · Staff login</div>

  <input id="gateEmail" type="email" placeholder="Email" autocomplete="username" />

<div id="app" style="display:none;">
  <header>
    <div class="wrap row">
      <div class="brand">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="22" cy="22" r="21" stroke="currentColor" stroke-width="0.8"/>
          <g transform="translate(22,22)">
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(0)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(45)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(90)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(135)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(180)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(225)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(270)"/>
            <ellipse cx="0" cy="-10" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(315)"/>
            <circle cx="0" cy="0" r="2.5" fill="currentColor"/>
          </g>
        </svg>
        <div>
          <div class="eyebrow">Sanvila</div>
          <div class="title">Daily Service &amp; Sales Report</div>
        </div>
      </div>
      <nav>
        <button onclick="goBack()" title="Back" aria-label="Back" style="padding:9px 12px;">&#8592;</button>
        <button onclick="goHome()" title="Home" aria-label="Home" style="padding:9px 12px;">&#8962;</button>
        <button id="tab-report" class="active" onclick="setTab('report')">Report</button>
        <button id="tab-add" onclick="setTab('add')">Add Entry</button>
        <button id="tab-all" onclick="setTab('all')">All Entries</button>
        <button id="tab-counter" onclick="setTab('counter')">Counter Payments</button>
        <button id="tab-tryon" onclick="setTab('tryon')">Hair Try-On</button>
        <button onclick="signOut()" style="border-color:rgba(203,169,110,.35);">Sign out</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<script>

const SUPABASE_URL = "https://wpcsicdciphkzikattpj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwY3NpY2RjaXBoa3ppa2F0dHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODEyMTQsImV4cCI6MjEwMTI1NzIxNH0.e90er89HIwrFkgqk69XY-jrXP_eyFhHu5GMH_XTf58w";
// Staff accounts are created by you in Supabase → Authentication → Users.
// There is no public sign-up on this page — only accounts you create can log in.
// ================================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function checkGate(){
  const email = document.getElementById('gateEmail').value.trim();
  const password = document.getElementById('gateInput').value;
  const errEl = document.getElementById('gateErr');
  errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = 'Incorrect email or password.'; return; }
  showApp();
}

async function signOut(){
  await sb.auth.signOut();
  document.getElementById('gate').style.display='flex';
  document.getElementById('app').style.display='none';
}

function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  init();
}

// If already signed in from a previous visit, skip straight to the app.
sb.auth.getSession().then(({ data }) => {
  if (data.session) showApp();
});

let entries = [];
let tab = 'report';
let rangeMode = 'today';
let customStart = todayISO();
let customEnd = todayISO();

function todayISO(){ return new Date().toISOString().slice(0,10); }
function displayDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function inRange(iso,start,end){ if(start && iso<start) return false; if(end && iso>end) return false; return true; }
function money(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }

async function init(){
  await loadEntries();
  render();
}

async function loadEntries(){
  const { data, error } = await sb.from('service_entries').select('*').order('date',{ascending:false});
  if(error){ alert('Could not load data: ' + error.message); return; }
  entries = data || [];
}

function getRange(){
  const t = todayISO();
  if(rangeMode==='today') return {start:t,end:t};
  if(rangeMode==='7days'){ const d=new Date(); d.setDate(d.getDate()-6); return {start:d.toISOString().slice(0,10),end:t}; }
  if(rangeMode==='month'){ const d=new Date(); const first=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10); return {start:first,end:t}; }
  if(rangeMode==='custom') return {start:customStart,end:customEnd};
  return {start:null,end:null};
}

let tabHistory = [];
function setTab(t){
  if(t !== tab) tabHistory.push(tab);
  tab=t; if(t!=='add') editingId=null; if(t==='add'){ editingId=null; } render();
}
function goBack(){
  if(tabHistory.length){
    tab = tabHistory.pop();
    editingId = null;
    render();
  } else if(window.history.length > 1){
    window.history.back();
  } else {
    window.location.href = '/';
  }
}
function goHome(){
  tabHistory = [];
  editingId = null;
  tab = 'report';
  rangeMode = 'today';
  render();
}
function setRange(r){ rangeMode=r; render(); }

function computeReport(){
  const {start,end} = getRange();
  const filtered = entries.filter(e => inRange(e.date,start,end));
  const map = {};
  filtered.forEach(e=>{
    const key = e.employee || 'Unassigned';
    if(!map[key]) map[key] = {employee:key,role:e.role,count:0,revenue:0,cash:0,upi:0,counterPay:0,other:0};
    map[key].count++;
    const amt = Number(e.amount)||0;
    map[key].revenue += amt;
    if(e.payment==='Cash') map[key].cash += amt;
    else if(e.payment==='UPI') map[key].upi += amt;
    else if(e.payment==='Counter') map[key].counterPay += amt;
    else map[key].other += amt;
  });
  const byEmployee = Object.values(map).sort((a,b)=>b.revenue-a.revenue);
  const totals = byEmployee.reduce((a,r)=>({count:a.count+r.count,revenue:a.revenue+r.revenue,cash:a.cash+r.cash,upi:a.upi+r.upi,counterPay:a.counterPay+r.counterPay,other:a.other+r.other}),{count:0,revenue:0,cash:0,upi:0,counterPay:0,other:0});
  return {start,end,byEmployee,totals};
}

function render(){
  ['report','add','all','counter','tryon'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active', t===tab));
  const main = document.getElementById('main');
  if(tab==='report') main.innerHTML = renderReport();
  else if(tab==='add'){ main.innerHTML = renderAdd(); toggleCounterMode(); }
  else if(tab==='counter') main.innerHTML = renderCounter();
  else if(tab==='tryon') main.innerHTML = renderTryOn();
  else main.innerHTML = renderAll();
}

function toggleCounterMode(){
  const paymentEl = document.getElementById('f_payment');
  if(!paymentEl) return;
  const isCounter = paymentEl.value === 'Counter';
  const note = document.getElementById('counterNote');
  if(note) note.style.display = isCounter ? 'block' : 'none';
  document.querySelectorAll('.field-group').forEach(group => {
    group.classList.toggle('dimmed', isCounter);
    group.querySelectorAll('input,select').forEach(el => { el.disabled = isCounter; });
  });
}

function renderReport(){
  const {start,end,byEmployee,totals} = computeReport();
  const maxRev = Math.max(1, ...byEmployee.map(r=>r.revenue));
  const filterBtns = [['today','Today'],['7days','Last 7 days'],['month','This month'],['all','All time'],['custom','Custom']]
    .map(([k,l])=>`<button class="filter-btn ${rangeMode===k?'active':''}" onclick="setRange('${k}')">${l}</button>`).join('');
  const customPicker = rangeMode==='custom' ? `
    <input type="date" value="${customStart}" onchange="customStart=this.value;render()" style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;">
    <span style="font-size:13px;color:var(--charcoal-soft);">to</span>
    <input type="date" value="${customEnd}" onchange="customEnd=this.value;render()" style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;">
  ` : '';
  const rangeLabel = start ? `${displayDate(start)} – ${displayDate(end)}` : 'All recorded dates';

  const bars = byEmployee.length===0 ? `<div class="empty">No services recorded for this period yet. Add one from the "Add Entry" tab.</div>` :
    byEmployee.map(r=>`
      <div class="bar-row">
        <div class="bar-head">
          <span><strong>${esc(r.employee)}</strong> <span style="font-size:12px;color:var(--charcoal-soft);">(${esc(r.role||'')})</span></span>
          <span style="color:var(--charcoal-soft);">${r.count} service${r.count!==1?'s':''} · ${money(r.revenue)}</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(r.revenue/maxRev)*100}%"></div></div>
        <div style="font-size:11px;color:var(--charcoal-soft);margin-top:4px;">Cash ${money(r.cash)} · UPI ${money(r.upi)}${r.counterPay?` · Counter ${money(r.counterPay)}`:''}${r.other?` · Other ${money(r.other)}`:''}</div>
      </div>`).join('');

  const rows = byEmployee.map((r,i)=>`
    <tr><td>${esc(r.employee)}</td><td>${esc(r.role||'')}</td><td style="text-align:right;">${r.count}</td>
    <td style="text-align:right;">${money(r.cash)}</td><td style="text-align:right;">${money(r.upi)}</td>
    <td style="text-align:right;">${money(r.counterPay)}</td>
    <td style="text-align:right;font-weight:600;">${money(r.revenue)}</td></tr>`).join('');
  const totalRow = byEmployee.length ? `<tr style="background:var(--gold);color:var(--ink);font-weight:600;">
    <td colspan="2">Total</td><td style="text-align:right;">${totals.count}</td>
    <td style="text-align:right;">${money(totals.cash)}</td><td style="text-align:right;">${money(totals.upi)}</td>
    <td style="text-align:right;">${money(totals.counterPay)}</td>
    <td style="text-align:right;">${money(totals.revenue)}</td></tr>` : '';

  return `
    <div class="filters">
      ${filterBtns}${customPicker}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
      <span style="font-size:12px;color:var(--charcoal-soft);">${rangeLabel}</span>
      <button class="btn" onclick="downloadSummary()">Download report</button>
    </div>
    <div class="stats">
      <div class="stat accent"><div class="label">Total Revenue</div><div class="value">${money(totals.revenue)}</div></div>
      <div class="stat"><div class="label">Services Done</div><div class="value">${totals.count}</div></div>
      <div class="stat"><div class="label">Cash Collected</div><div class="value">${money(totals.cash)}</div></div>
      <div class="stat"><div class="label">UPI Collected</div><div class="value">${money(totals.upi)}</div></div>
      <div class="stat"><div class="label">Counter Collected</div><div class="value">${money(totals.counterPay)}</div></div>
    </div>
    <div class="card" style="margin-bottom:24px;">
      <div style="font-family:Georgia,serif;font-size:18px;margin-bottom:18px;">Revenue by employee</div>
      ${bars}
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr><th>Employee</th><th>Role</th><th style="text-align:right;">Services</th><th style="text-align:right;">Cash</th><th style="text-align:right;">UPI</th><th style="text-align:right;">Counter</th><th style="text-align:right;">Total Revenue</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody></table>
    </div>`;
}

const SERVICE_TYPE_GROUPS = {
  'Body Spa & Massage': ['Dry Massage','Aroma Massage','Swedish Massage','Deep Tissue Massage','Body Polishing','Cream Massage'],
  'Hair Styling': ['Cutting','Styling','Blow Dry','Hair Colour','Straightening/Smoothening/Re-bonding','Nanoplastia','Botox','Hair Spa','Keratin'],
  'Beauty Services': ['Threading','Waxing','Facial']
};
const SERVICE_TYPES = Object.values(SERVICE_TYPE_GROUPS).flat();
const ROLES = ['Therapist','Beautician','Hairstylist'];
const ROLE_CATEGORY_MAP = { 'Therapist':'Body Spa & Massage', 'Hairstylist':'Hair Styling', 'Beautician':'Beauty Services' };
const KNOWN_EMPLOYEES = ['Bikash'];
let editingId = null;

function groupsForRole(role){
  const group = ROLE_CATEGORY_MAP[role];
  return group ? { [group]: SERVICE_TYPE_GROUPS[group] } : SERVICE_TYPE_GROUPS;
}

function buildServiceOptionsHTML(role, selected){
  const groups = groupsForRole(role);
  const flat = Object.values(groups).flat();
  const optgroups = Object.entries(groups).map(([group, types]) =>
    `<optgroup label="${esc(group)}">${types.map(s => `<option value="${esc(s)}" ${selected===s?'selected':''}>${esc(s)}</option>`).join('')}</optgroup>`
  ).join('');
  const other = selected && !flat.includes(selected) ? `<option value="${esc(selected)}" selected>${esc(selected)} (other)</option>` : '';
  return `<option value="">— Select —</option>${optgroups}${other}`;
}

function onRoleChange(){
  const roleEl = document.getElementById('f_role');
  const typeEl = document.getElementById('f_serviceType');
  if(!roleEl || !typeEl) return;
  const flat = Object.values(groupsForRole(roleEl.value)).flat();
  const keep = flat.includes(typeEl.value) ? typeEl.value : '';
  typeEl.innerHTML = buildServiceOptionsHTML(roleEl.value, keep);
}

function onEmployeeSelectChange(){
  const sel = document.getElementById('f_employee_select');
  const txt = document.getElementById('f_employee');
  if(!sel || !txt) return;
  if(sel.value === '__other__'){
    txt.style.display = 'block';
    txt.value = '';
    txt.focus();
  } else {
    txt.style.display = 'none';
    txt.value = sel.value;
  }
}

function renderAdd(){
  const editing = editingId ? entries.find(e => e.id === editingId) : null;
  const v = editing || { date: todayISO(), name:'', number:'', service_type:'', employee:'', role:'Therapist', amount:'', payment:'Cash', counter:'' };
  const serviceOptions = buildServiceOptionsHTML(v.role || 'Therapist', v.service_type);
  const employeeList = [...new Set([...KNOWN_EMPLOYEES, ...entries.map(e=>e.employee).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
  return `
    <div class="card" style="max-width:640px;">
      <div style="font-family:Georgia,serif;font-size:18px;margin-bottom:20px;">${editing ? 'Edit entry' : "Add today's entry"}</div>
      <div id="formError" class="error"></div>
      <form class="entry" onsubmit="return submitEntry(event)">
        <div><label>Date</label><input type="date" id="f_date" value="${v.date}"></div>
        <div><label>Employee / Therapist *</label>
          <select id="f_employee_select" onchange="onEmployeeSelectChange()">
            <option value="">— Select —</option>
            ${employeeList.map(e=>`<option value="${esc(e)}" ${v.employee===e?'selected':''}>${esc(e)}</option>`).join('')}
            <option value="__other__" ${v.employee && !employeeList.includes(v.employee) ? 'selected':''}>+ Add new employee</option>
          </select>
          <input type="text" id="f_employee" placeholder="Enter new employee name" value="${esc(v.employee||'')}" style="margin-top:8px;${(!v.employee || employeeList.includes(v.employee)) ? 'display:none;':''}">
        </div>
        <div><label>Amount received (₹) *</label><input type="number" min="0" id="f_amount" value="${v.amount===''?'':Number(v.amount)}"></div>
        <div><label>Payment mode</label>
          <select id="f_payment" onchange="toggleCounterMode()">
            <option value="Cash" ${v.payment==='Cash'?'selected':''}>Cash</option>
            <option value="UPI" ${v.payment==='UPI'?'selected':''}>UPI</option>
            <option value="Counter" ${v.payment==='Counter'?'selected':''}>Counter Payment</option>
            <option value="Other" ${v.payment==='Other'?'selected':''}>Other</option>
          </select>
        </div>
        <div class="counter-note" id="counterNote" style="display:none;">Counter payment entry — only date, employee and amount are needed. The fields below are dimmed and won't be saved.</div>
        <div class="field-group full"><label>Client name</label><input type="text" id="f_name" placeholder="e.g. Client" value="${esc(v.name||'')}"></div>
        <div class="field-group full"><label>Client number (optional)</label><input type="text" id="f_number" value="${esc(v.number||'')}"></div>
        <div class="field-group"><label>Role</label>
          <select id="f_role" onchange="onRoleChange()">
            ${ROLES.map(r=>`<option value="${esc(r)}" ${v.role===r?'selected':''}>${esc(r)}</option>`).join('')}
            ${v.role && !ROLES.includes(v.role) ? `<option value="${esc(v.role)}" selected>${esc(v.role)}</option>` : ''}
          </select>
        </div>
        <div class="field-group"><label>Service type</label>
          <select id="f_serviceType">
            ${serviceOptions}
          </select>
        </div>
        <div class="full" style="display:flex;gap:10px;">
          <button type="submit" class="btn">${editing ? 'Update entry' : 'Save entry'}</button>
          ${editing ? `<button type="button" class="btn outline" onclick="cancelEdit()">Cancel</button>` : ''}
        </div>
      </form>
    </div>`;
}

function editEntry(id){
  editingId = id;
  tab = 'add';
  render();
}

function cancelEdit(){
  editingId = null;
  render();
}

function renderAll(){
  const sorted = [...entries].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const rows = sorted.map(e=>`
    <tr><td>${displayDate(e.date)}</td><td>${esc(e.name||'')}${e.number?` · ${esc(e.number)}`:''}</td>
    <td>${esc(e.type||'')}${e.service_type?` — ${esc(e.service_type)}`:''}</td>
    <td>${esc(e.employee||'')}</td><td>${esc(e.role||'')}</td>
    <td style="text-align:right;">${money(e.amount)}</td><td>${esc(e.payment||'')}</td>
    <td style="white-space:nowrap;">
      <button onclick="editEntry('${e.id}')" style="border:none;background:none;color:var(--gold);cursor:pointer;font-weight:500;">Edit</button>
      <button onclick="deleteEntry('${e.id}')" style="border:none;background:none;color:var(--danger);cursor:pointer;margin-left:8px;">Delete</button>
    </td></tr>`).join('');
  return `
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="toolbar"><button class="btn" onclick="downloadRaw()">Download all entries</button></div>
      <div style="overflow-x:auto;">
        <table><thead><tr><th>Date</th><th>Client</th><th>Service</th><th>Employee</th><th>Role</th><th style="text-align:right;">Amount</th><th>Mode</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function renderCounter(){
  const counterEntries = [...entries].filter(e => e.payment === 'Counter')
    .sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const total = counterEntries.reduce((s,e)=> s + (Number(e.amount)||0), 0);
  const rows = counterEntries.map(e=>`
    <tr><td>${displayDate(e.date)}</td><td>${esc(e.employee||'')}</td><td>${esc(e.role||'')}</td>
    <td style="text-align:right;">${money(e.amount)}</td>
    <td style="white-space:nowrap;">
      <button onclick="editEntry('${e.id}')" style="border:none;background:none;color:var(--gold);cursor:pointer;font-weight:500;">Edit</button>
      <button onclick="deleteEntry('${e.id}')" style="border:none;background:none;color:var(--danger);cursor:pointer;margin-left:8px;">Delete</button>
    </td></tr>`).join('');
  const empty = counterEntries.length === 0 ? `<tr><td colspan="5" style="text-align:center;color:var(--charcoal-soft);padding:24px;">No counter payments recorded yet. Add one from the Add Entry tab by choosing "Counter Payment" as the payment mode.</td></tr>` : '';
  return `
    <div class="stats" style="margin-bottom:20px;">
      <div class="stat"><div class="label">Counter Entries</div><div class="value">${counterEntries.length}</div></div>
      <div class="stat"><div class="label">Total Counter Collected</div><div class="value">${money(total)}</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="toolbar"><button class="btn" onclick="downloadCounter()" ${counterEntries.length===0?'disabled':''}>Download counter payments</button></div>
      <div style="overflow-x:auto;">
        <table><thead><tr><th>Date</th><th>Employee</th><th>Role</th><th style="text-align:right;">Amount</th><th></th></tr></thead>
        <tbody>${rows || empty}</tbody></table>
      </div>
    </div>`;
}

function downloadCounter(){
  const counterEntries = [...entries].filter(e => e.payment === 'Counter')
    .sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const headers = ['Date','Employee','Role','Amount'];
  const rows = counterEntries.map(e=>[e.date, e.employee, e.role, e.amount]);
  downloadCSV(`sanvila-counter-payments-${todayISO()}.csv`, toCSV(headers, rows));
}

function renderTryOn(){
  return `
    <div class="card" style="max-width:640px;">
      <h2 style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;margin:0 0 6px;color:var(--cream);">Hairstyle Preview</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.6;">
        Upload the customer's photo, then either upload a reference hairstyle photo, describe the style
        in words, or both. We'll generate a realistic preview of the customer with that hairstyle.
      </p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;">
        <div class="field-group">
          <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;">Customer photo *</label>
          <input type="file" accept="image/*" id="tryon_target" onchange="previewImg('tryon_target','preview_target')">
          <img id="preview_target" style="margin-top:10px;max-width:100%;border-radius:4px;border:1px solid var(--line);display:none;">
        </div>
        <div class="field-group">
          <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;">Reference hairstyle photo (optional)</label>
          <input type="file" accept="image/*" id="tryon_source" onchange="previewImg('tryon_source','preview_source')">
          <img id="preview_source" style="margin-top:10px;max-width:100%;border-radius:4px;border:1px solid var(--line);display:none;">
        </div>
      </div>
      <div class="field-group" style="margin-bottom:20px;">
        <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;">Describe the hairstyle (optional, works with or without a reference photo)</label>
        <input type="text" id="tryon_note" placeholder="e.g. shoulder-length layered bob, soft waves">
      </div>
      <button class="btn" onclick="startTryOn()" id="tryon_btn">Generate Preview</button>
      <div id="tryon_status" style="margin-top:16px;font-size:13px;color:var(--muted);"></div>
      <div id="tryon_result" style="margin-top:20px;"></div>
      <p style="color:var(--muted);font-size:11.5px;margin-top:24px;line-height:1.6;">
        Only use a customer's photo with their consent. Photos are sent directly to Google's Gemini API
        for processing and are not stored by this app.
      </p>
    </div>`;
}

function previewImg(inputId, imgId){
  const input = document.getElementById(inputId);
  const img = document.getElementById(imgId);
  if(input.files && input.files[0]){
    img.src = URL.createObjectURL(input.files[0]);
    img.style.display = 'block';
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startTryOn(){
  const targetFile = document.getElementById('tryon_target').files[0];
  const sourceFile = document.getElementById('tryon_source').files[0];
  const styleNote = document.getElementById('tryon_note').value.trim();
  const statusEl = document.getElementById('tryon_status');
  const resultEl = document.getElementById('tryon_result');
  const btn = document.getElementById('tryon_btn');
  resultEl.innerHTML = '';
  if(!targetFile){ statusEl.textContent = 'Please upload the customer photo.'; return; }
  if(!sourceFile && !styleNote){ statusEl.textContent = 'Add a reference photo, a style description, or both.'; return; }
  btn.disabled = true;
  try{
    statusEl.textContent = 'Generating preview… this usually takes a few seconds.';
    const targetImage = await fileToBase64(targetFile);
    const payload = { targetImage, targetMimeType: targetFile.type, styleNote };
    if(sourceFile){
      payload.referenceImage = await fileToBase64(sourceFile);
      payload.referenceMimeType = sourceFile.type;
    }
    const r = await fetch('/api/tryon', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Generation failed');
    statusEl.textContent = 'Done!';
    const src = `data:${data.mimeType};base64,${data.image}`;
    resultEl.innerHTML = `<img src="${src}" style="max-width:100%;border-radius:4px;border:1px solid var(--line);"><div style="margin-top:10px;"><a class="btn outline" href="${src}" download="sanvila-hairstyle-preview.png" style="text-decoration:none;">Download</a></div>`;
  } catch(err){
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function submitEntry(ev){
  ev.preventDefault();
  const employee = document.getElementById('f_employee').value.trim();
  const amount = document.getElementById('f_amount').value;
  const errEl = document.getElementById('formError');
  errEl.textContent = '';
  if(!employee){ errEl.textContent = 'Employee name is required.'; return false; }
  if(amount === '' || Number(amount) < 0){ errEl.textContent = 'Enter a valid amount.'; return false; }
  const payment = document.getElementById('f_payment').value;
  const isCounter = payment === 'Counter';
  const entry = {
    date: document.getElementById('f_date').value,
    name: isCounter ? 'Counter Payment' : (document.getElementById('f_name').value.trim() || 'Client'),
    number: isCounter ? '' : document.getElementById('f_number').value.trim(),
    type: isCounter ? 'Counter Payment' : (ROLE_CATEGORY_MAP[document.getElementById('f_role').value.trim()] || document.getElementById('f_role').value.trim()),
    service_type: isCounter ? '' : document.getElementById('f_serviceType').value.trim(),
    employee, role: document.getElementById('f_role').value.trim() || 'Therapist',
    amount: Number(amount),
    payment,
  };
  let error, data;
  const wasEditing = !!editingId;
  if(editingId){
    ({ error, data } = await sb.from('service_entries').update(entry).eq('id', editingId).select());
  } else {
    ({ error, data } = await sb.from('service_entries').insert([entry]).select());
  }
  if(error){ errEl.textContent = 'Could not save: ' + error.message; return false; }
  if(!data || data.length === 0){
    errEl.textContent = wasEditing
      ? 'Update was blocked by the database (0 rows changed). This usually means your Supabase table is missing an UPDATE permission policy for this login — see the note below the form.'
      : 'Save was blocked by the database (0 rows created). This usually means your Supabase table is missing an INSERT permission policy for this login.';
    return false;
  }
  editingId = null;
  await loadEntries();
  tab = wasEditing ? 'all' : 'report';
  render();
  if(wasEditing) flashMessage('Entry updated successfully.');
  return false;
}

let flashTimer = null;
function flashMessage(msg){
  let el = document.getElementById('flashMsg');
  if(!el){
    el = document.createElement('div');
    el.id = 'flashMsg';
    el.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:2px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.5);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3000);
}

async function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  const { error, data } = await sb.from('service_entries').delete().eq('id', id).select();
  if(error){ alert('Could not delete: ' + error.message); return; }
  if(!data || data.length === 0){
    alert('Delete was blocked by the database (0 rows removed). This usually means your Supabase table is missing a DELETE permission policy for this login.');
    return;
  }
  await loadEntries();
  render();
}

function toCSV(headers, rows){
  const esc2 = v => { const s = String(v??''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  return [headers.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
}
function downloadCSV(filename, csv){
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function downloadSummary(){
  const {byEmployee,totals} = computeReport();
  const headers = ['Employee','Role','Services','Cash','UPI','Counter','Other','Total Revenue'];
  const rows = byEmployee.map(r=>[r.employee,r.role,r.count,r.cash,r.upi,r.counterPay,r.other,r.revenue]);
  rows.push(['Total','',totals.count,totals.cash,totals.upi,totals.counterPay,totals.other,totals.revenue]);
  downloadCSV(`sanvila-report-${rangeMode}-${todayISO()}.csv`, toCSV(headers, rows));
}
function downloadRaw(){
  const sorted = [...entries].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const headers = ['Date','Client Name','Number','Type','Service Type','Employee','Role','Amount','Payment Mode'];
  const rows = sorted.map(e=>[displayDate(e.date),e.name,e.number,e.type,e.service_type,e.employee,e.role,e.amount,e.payment]);
  downloadCSV(`sanvila-all-entries-${todayISO()}.csv`, toCSV(headers, rows));
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
